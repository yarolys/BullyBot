[project]
name = "bullybot"
version = "0.2.0"
description = "Async Telegram group bot with sounds, moderation and voice recognition"
authors = [{name = "yarolys", email = "lysov.yaroslav.r@mail.ru"}]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram[proxy]>=3.31.0,<4",
    "aiohttp>=3.14.3,<3.15",
    "aiohttp-socks>=0.12.0,<0.13",
    "alembic>=1.20.0,<2",
    "asyncpg>=0.31.0,<0.32",
    "celery[redis]>=5.6.3,<6",
    "loguru>=0.7.3,<0.8",
    "pydantic>=2.13.5,<2.14",
    "python-dotenv>=1.2.3,<2",
    "requests>=2.34.2,<3",
    "SpeechRecognition>=3.17.0,<4",
    "SQLAlchemy[asyncio]>=2.0.54,<2.1",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.4.1,<3"]
build-backend = "poetry.core.masonry.api"
